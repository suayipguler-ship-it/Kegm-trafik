<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boğaz Trafik Planlama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 12px; }
        
        .header { text-align: center; margin-bottom: 14px; padding: 8px; border-bottom: 1px solid #1e293b; }
        .header h1 { font-size: 1.1rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }

        .filter-card { background-color: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
        .filter-row { display: flex; gap: 8px; }
        select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #f8fafc; font-size: 0.85rem; }
        select:focus, button:focus { outline: none; border-color: #38bdf8; }
        
        button.btn-search { background-color: #0284c7; border: none; font-weight: 600; cursor: pointer; color: #fff; }
        button.btn-search:active { background-color: #0369a1; }

        .ship-list { display: flex; flex-direction: column; gap: 10px; }
        .ship-card { background-color: #1e293b; border-radius: 10px; padding: 12px; border-left: 5px solid #38bdf8; position: relative; }
        .ship-card.assigned { border-left-color: #22c55e; background-color: #132337; }

        .ship-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
        .ship-name { font-size: 1rem; font-weight: bold; color: #ffffff; }
        .ship-time { font-size: 0.85rem; font-weight: 600; color: #38bdf8; background: #0f172a; padding: 2px 6px; border-radius: 4px; }

        .ship-details { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
        .ship-details span { color: #e2e8f0; font-weight: 500; }

        .pilot-row { display: flex; gap: 6px; align-items: center; border-top: 1px solid #334155; padding-top: 8px; }
        .pilot-input { flex: 1; padding: 8px; font-size: 0.85rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; }
        .btn-assign { width: auto; padding: 8px 16px; background: #0284c7; border: none; font-size: 0.85rem; font-weight: 600; border-radius: 6px; cursor: pointer; color: #fff; }
        .btn-assign.saved { background: #22c55e; }

        .status-msg { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: 24px; }
        .toast-notify { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #000; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; display: none; z-index: 99; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Boğaz Geçiş Planlama</h1>
    </div>

    <div class="filter-card">
        <div class="filter-row">
            <select id="selBogaz" onchange="renderList()">
                <option value="CANAKKALE">Çanakkale</option>
                <option value="ISTANBUL">İstanbul</option>
            </select>
            <select id="selYon" onchange="renderList()">
                <option value="GÜNEY-KUZEY">Güney - Kuzey</option>
                <option value="KUZEY-GÜNEY">Kuzey - Güney</option>
            </select>
        </div>
        <select id="selHareket" onchange="renderList()">
            <option value="PLAN. GEÇİŞ">PLAN. GEÇİŞ</option>
            <option value="GEÇİŞE HAZIR">GEÇİŞE HAZIR</option>
            <option value="BOĞAZDA">BOĞAZDA</option>
        </select>
        <button class="btn-search" onclick="loadShipsData()">Listeyi Yenile</button>
    </div>

    <div id="shipContainer" class="ship-list">
        <div class="status-msg">Veriler yükleniyor...</div>
    </div>
    
    <div id="toast" class="toast-notify">Kılavuz Atandı!</div>

    <script>
        let allShips = [];

        function getAssignments() {
            try {
                return JSON.parse(localStorage.getItem("kegm_pilot_store") || "{}");
            } catch (e) {
                return {};
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg;
            t.style.display = "block";
            setTimeout(() => { t.style.display = "none"; }, 1500);
        }

        function savePilot(index, shipName) {
            const input = document.getElementById("pilot_in_" + index);
            const btn = document.getElementById("pilot_btn_" + index);
            const card = document.getElementById("card_" + index);
            
            const pilotName = input.value.trim();
            const assignments = getAssignments();

            if (pilotName.length > 0) {
                assignments[shipName] = pilotName;
                card.classList.add("assigned");
                btn.classList.add("saved");
                btn.innerText = "Kaydedildi";
                showToast(shipName + " atandı!");
            } else {
                delete assignments[shipName];
                card.classList.remove("assigned");
                btn.classList.remove("saved");
                btn.innerText = "Ata";
                showToast("Atama silindi.");
            }

            localStorage.setItem("kegm_pilot_store", JSON.stringify(assignments));
        }

        async function loadShipsData() {
            const container = document.getElementById("shipContainer");
            container.innerHTML = '<div class="status-msg">Veri güncelleniyor...</div>';
            
            try {
                const res = await fetch("ships.json?t=" + Date.now());
                if (!res.ok) throw new Error("Dosya bulunamadı");
                allShips = await res.json();
                renderList();
            } catch (err) {
                container.innerHTML = '<div class="status-msg">Gemi verisi hazırlanıyor, lütfen birazdan butona tekrar dokunun.</div>';
            }
        }

        function renderList() {
            const container = document.getElementById("shipContainer");
            const bogaz = document.getElementById("selBogaz").value;
            const yon = document.getElementById("selYon").value;
            const hareket = document.getElementById("selHareket").value;
            const assignments = getAssignments();

            const filtered = allShips.filter(s => 
                s.bogaz === bogaz && s.yon === yon && s.hareket === hareket
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="status-msg">Bu kritere uygun gemi bulunamadı.</div>';
                return;
            }

            let html = "";
            filtered.forEach((ship, index) => {
                const assignedPilot = assignments[ship.name] || "";
                const isAssigned = assignedPilot.length > 0;

                html += `
                    <div class="ship-card ${isAssigned ? 'assigned' : ''}" id="card_${index}">
                        <div class="ship-header">
                            <span class="ship-name">${ship.name}</span>
                            <span class="ship-time">${ship.time}</span>
                        </div>
                        <div class="ship-details">
                            Boy: <span>${ship.len}</span> | Tip: <span>${ship.type}</span><br>
                            Kılavuz Talebi: <span>${ship.pilotReq}</span> | Römorkör: <span>${ship.tug}</span>
                        </div>
                        <div class="pilot-row">
                            <input type="text" 
                                   id="pilot_in_${index}" 
                                   class="pilot-input" 
                                   placeholder="Kılavuz Kaptan Ata..." 
                                   value="${assignedPilot}">
                            <button id="pilot_btn_${index}" 
                                    class="btn-assign ${isAssigned ? 'saved' : ''}" 
                                    onclick="savePilot(${index}, '${ship.name.replace(/'/g, "\\'")}')">
                                ${isAssigned ? 'Kaydedildi' : 'Ata'}
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.onload = loadShipsData;
    </script>
</body>
</html>
