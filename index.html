<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOĞAZ GEÇİŞ PLANLAMA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #050b14; color: #f8fafc; padding: 12px; }
        
        .header { text-align: center; margin-bottom: 12px; padding: 6px; }
        .header h1 { font-size: 1.15rem; color: #38bdf8; letter-spacing: 1px; font-weight: 700; }

        .filter-card { background-color: #0f172a; border-radius: 12px; padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #1e293b; }
        .filter-row { display: flex; gap: 8px; }
        select, input, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background-color: #0b1329; color: #f8fafc; font-size: 0.9rem; font-weight: 500; }
        select:focus, input:focus, button:focus { outline: none; border-color: #38bdf8; }
        
        .search-box { background-color: #131f37; border-color: #0284c7; font-size: 0.95rem; }
        .search-box::placeholder { color: #64748b; }

        button.btn-search { background-color: #0284c7; border: none; font-weight: 700; cursor: pointer; color: #fff; margin-top: 2px; }
        button.btn-search:active { background-color: #0369a1; }

        .ship-list { display: flex; flex-direction: column; gap: 10px; }
        .ship-card { background-color: #0f172a; border-radius: 10px; padding: 12px; border-left: 5px solid #38bdf8; border: 1px solid #1e293b; border-left-width: 5px; }
        .ship-card.assigned { border-left-color: #22c55e; background-color: #08211b; }

        .ship-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        
        /* Gemi adı tıklanabilir AIS linki */
        .ship-name-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .ship-name-link:active { color: #38bdf8; }
        .ais-icon { font-size: 0.85rem; color: #38bdf8; }

        .ship-time { font-size: 0.82rem; font-weight: 600; color: #38bdf8; background: #0b1329; padding: 2px 6px; border-radius: 4px; }

        .ship-details { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
        .ship-details span { color: #e2e8f0; font-weight: 500; }

        .pilot-row { display: flex; gap: 6px; align-items: center; border-top: 1px solid #1e293b; padding-top: 8px; }
        .pilot-input { flex: 1; padding: 8px; font-size: 0.85rem; border-radius: 6px; border: 1px solid #334155; background: #0b1329; color: #f8fafc; }
        .btn-assign { width: auto; padding: 8px 16px; background: #0284c7; border: none; font-size: 0.85rem; font-weight: 600; border-radius: 6px; cursor: pointer; color: #fff; }
        .btn-assign.saved { background: #22c55e; }

        .status-msg { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: 24px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>BOĞAZ GEÇİŞ PLANLAMA</h1>
    </div>

    <div class="filter-card">
        <!-- Canlı Arama -->
        <input type="text" id="txtShipSearch" class="search-box" placeholder="🔍 Gemi Adı Ara..." oninput="renderList()">

        <div class="filter-row">
            <select id="selBogaz" onchange="renderList()">
                <option value="CANAKKALE">CANAKKALE</option>
                <option value="ISTANBUL">ISTANBUL</option>
            </select>
            <select id="selYon" onchange="renderList()">
                <option value="GÜNEY-KUZEY">GÜNEY-KUZEY</option>
                <option value="KUZEY-GÜNEY">KUZEY-GÜNEY</option>
            </select>
        </div>
        <select id="selHareket" onchange="renderList()">
            <option value="PLAN. GEÇİŞ">PLAN. GEÇİŞ</option>
            <option value="GEÇİŞE HAZIR">GEÇİŞE HAZIR</option>
            <option value="BOĞAZDA">BOĞAZDA</option>
        </select>
        <button class="btn-search" onclick="loadShipsData()">Listeyi Yenile</button>
    </div>

    <div id="shipContainer" class="ship-list">
        <div class="status-msg">Veriler yükleniyor...</div>
    </div>

    <script>
        let allShips = [];

        function getAssignments() {
            try {
                return JSON.parse(localStorage.getItem("kegm_pilot_store") || "{}");
            } catch (e) {
                return {};
            }
        }

        function parseTimeString(timeStr) {
            if (!timeStr) return 9999999999999;
            
            // "08.09.26 22:00" veya "08.09.2026 22:00" formatı
            const dateMatch = timeStr.match(/(\d{2})[./](\d{2})[./](\d{2,4})\s+(\d{2}):(\d{2})/);
            if (dateMatch) {
                const day = parseInt(dateMatch[1], 10);
                const month = parseInt(dateMatch[2], 10) - 1;
                let year = parseInt(dateMatch[3], 10);
                if (year < 100) year += 2000;
                const hour = parseInt(dateMatch[4], 10);
                const minute = parseInt(dateMatch[5], 10);
                return new Date(year, month, day, hour, minute).getTime();
            }

            // Sadece saat formatı
            const timeOnlyMatch = timeStr.match(/(\d{2}):(\d{2})/);
            if (timeOnlyMatch) {
                const now = new Date();
                return new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(timeOnlyMatch[1], 10), parseInt(timeOnlyMatch[2], 10)).getTime();
            }

            return 9999999999999;
        }

        function savePilot(index, uniqueKey) {
            const input = document.getElementById("pilot_in_" + index);
            const btn = document.getElementById("pilot_btn_" + index);
            const card = document.getElementById("card_" + index);
            
            const pilotName = input.value.trim();
            const assignments = getAssignments();

            if (pilotName.length > 0) {
                assignments[uniqueKey] = pilotName;
                card.classList.add("assigned");
                btn.classList.add("saved");
                btn.innerText = "Kaydedildi";
            } else {
                delete assignments[uniqueKey];
                card.classList.remove("assigned");
                btn.classList.remove("saved");
                btn.innerText = "Ata";
            }

            localStorage.setItem("kegm_pilot_store", JSON.stringify(assignments));
        }

        async function loadShipsData() {
            const container = document.getElementById("shipContainer");
            container.innerHTML = '<div class="status-msg">Veri yükleniyor...</div>';
            
            try {
                const res = await fetch("ships.json?t=" + Date.now());
                if (!res.ok) throw new Error("Dosya okunamadı");
                allShips = await res.json();
                renderList();
            } catch (err) {
                container.innerHTML = '<div class="status-msg">Gemi verisi henüz hazır değil. Lütfen birazdan tekrar deneyin.</div>';
            }
        }

        function renderList() {
            const container = document.getElementById("shipContainer");
            const bogaz = document.getElementById("selBogaz").value;
            const yon = document.getElementById("selYon").value;
            const hareket = document.getElementById("selHareket").value;
            const searchQuery = document.getElementById("txtShipSearch").value.trim().toLowerCase();
            const assignments = getAssignments();

            let filtered = allShips.filter(s => {
                const matchFilter = s.bogaz === bogaz && s.yon === yon && s.hareket === hareket;
                if (!matchFilter) return false;
                if (searchQuery.length > 0) {
                    return s.name.toLowerCase().includes(searchQuery);
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="status-msg">Bu kritere uygun gemi bulunamadı.</div>';
                return;
            }

            // Kronolojik sıralama
            filtered.sort((a, b) => parseTimeString(a.time) - parseTimeString(b.time));

            let html = "";
            filtered.forEach((ship, index) => {
                // Tekil kimlik: İsim + Saat (Aynı isimli gemiler çakışmaz)
                const uniqueKey = `${ship.name}_${ship.time}`;
                const assignedPilot = assignments[uniqueKey] || assignments[ship.name] || "";
                const isAssigned = assignedPilot.length > 0;
                
                // AIS URL Kurgusu: IMO varsa nokta atışı resmi profil, yoksa Google şanslı arama
                let aisUrl = "";
                if (ship.imo && ship.imo.length === 7) {
                    aisUrl = `https://www.marinetraffic.com/en/ais/details/ships/imo:${ship.imo}`;
                } else {
                    aisUrl = `https://www.google.com/search?q=${encodeURIComponent(ship.name + ' ' + ship.len + 'm marinetraffic')}&btnI=1`;
                }

                html += `
                    <div class="ship-card ${isAssigned ? 'assigned' : ''}" id="card_${index}">
                        <div class="ship-header">
                            <a href="${aisUrl}" target="_blank" rel="noopener noreferrer" class="ship-name-link">
                                ${ship.name} <span class="ais-icon">↗</span>
                            </a>
                            <span class="ship-time">${ship.time}</span>
                        </div>
                        <div class="ship-details">
                            Boy: <span>${ship.len}</span> | Tip: <span>${ship.type}</span><br>
                            Kılavuz Talebi: <span>${ship.pilotReq}</span> | Römorkör: <span>${ship.tug}</span>
                        </div>
                        <div class="pilot-row">
                            <input type="text" 
                                   id="pilot_in_${index}" 
                                   class="pilot-input" 
                                   placeholder="Kılavuz Kaptan Ata..." 
                                   value="${assignedPilot}">
                            <button id="pilot_btn_${index}" 
                                    class="btn-assign ${isAssigned ? 'saved' : ''}" 
                                    onclick="savePilot(${index}, '${uniqueKey.replace(/'/g, "\\'")}')">
                                ${isAssigned ? 'Kaydedildi' : 'Ata'}
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.onload = loadShipsData;
    </script>
</body>
</html>
