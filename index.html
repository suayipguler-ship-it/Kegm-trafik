<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boğaz Trafik Planlama</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 12px; }
        
        .header { text-align: center; margin-bottom: 14px; padding: 8px; border-bottom: 1px solid #1e293b; }
        .header h1 { font-size: 1.1rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }

        .filter-card { background-color: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
        .filter-row { display: flex; gap: 8px; }
        select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #f8fafc; font-size: 0.85rem; }
        select:focus, button:focus { outline: none; border-color: #38bdf8; }
        
        button.btn-search { background-color: #0284c7; border: none; font-weight: 600; cursor: pointer; }
        button.btn-search:active { background-color: #0369a1; }

        .ship-list { display: flex; flex-direction: column; gap: 10px; }
        .ship-card { background-color: #1e293b; border-radius: 10px; padding: 12px; border-left: 4px solid #38bdf8; position: relative; }
        .ship-card.assigned { border-left-color: #22c55e; }

        .ship-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
        .ship-name { font-size: 1rem; font-weight: bold; color: #ffffff; }
        .ship-time { font-size: 0.85rem; font-weight: 600; color: #38bdf8; background: #0f172a; padding: 2px 6px; border-radius: 4px; }

        .ship-details { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
        .ship-details span { color: #e2e8f0; font-weight: 500; }

        .pilot-row { display: flex; gap: 6px; align-items: center; border-top: 1px solid #334155; padding-top: 8px; }
        .pilot-input { flex: 1; padding: 8px; font-size: 0.85rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; }
        .btn-assign { width: auto; padding: 8px 16px; background: #22c55e; border: none; font-size: 0.85rem; font-weight: 600; border-radius: 6px; cursor: pointer; color: #fff; }
        .btn-assign:active { background: #16a34a; }

        .status-msg { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: 24px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Boğaz Geçiş Planlama</h1>
    </div>

    <div class="filter-card">
        <div class="filter-row">
            <select id="selBogaz" onchange="applyFilter()">
                <option value="CANAKKALE">Çanakkale</option>
                <option value="ISTANBUL">İstanbul</option>
            </select>
            <select id="selYon" onchange="applyFilter()">
                <option value="KUZEY-GÜNEY">Kuzey - Güney</option>
                <option value="GÜNEY-KUZEY">Güney - Kuzey</option>
            </select>
        </div>
        <select id="selHareket" onchange="applyFilter()">
            <option value="GEÇİŞE HAZIR">Geçişe Hazır</option>
            <option value="PLAN. GEÇİŞ">Planlanan Geçiş</option>
            <option value="BOĞAZDA">Boğazda</option>
        </select>
        <button class="btn-search" onclick="applyFilter()">Listeyi Getir</button>
    </div>

    <div id="shipContainer" class="ship-list"></div>

    <script>
        // Boğaz, yön ve hareket tiplerine göre dinamik sıralı filo veritabanı
        const masterShipDB = [
            // Çanakkale - Kuzey-Güney
            { bogaz: "CANAKKALE", yon: "KUZEY-GÜNEY", hareket: "GEÇİŞE HAZIR", name: "LADY ROSE", time: "16:30", len: "180 m", type: "Dökme Yük", pilotReq: "Evet", tug: "Hayır" },
            { bogaz: "CANAKKALE", yon: "KUZEY-GÜNEY", hareket: "GEÇİŞE HAZIR", name: "MARMARA STAR", time: "17:15", len: "145 m", type: "Genel Kargo", pilotReq: "Hayır", tug: "Hayır" },
            { bogaz: "CANAKKALE", yon: "KUZEY-GÜNEY", hareket: "PLAN. GEÇİŞ", name: "AEGEAN VOYAGER", time: "18:00", len: "220 m", type: "Konteyner", pilotReq: "Evet", tug: "Evet" },
            { bogaz: "CANAKKALE", yon: "KUZEY-GÜNEY", hareket: "BOĞAZDA", name: "AKDENİZ 1", time: "15:40", len: "110 m", type: "Kimyasal Tanker", pilotReq: "Evet", tug: "Hayır" },

            // Çanakkale - Güney-Kuzey
            { bogaz: "CANAKKALE", yon: "GÜNEY-KUZEY", hareket: "GEÇİŞE HAZIR", name: "OCEAN GLORY", time: "16:50", len: "195 m", type: "Dökme Yük", pilotReq: "Evet", tug: "Hayır" },
            { bogaz: "CANAKKALE", yon: "GÜNEY-KUZEY", hareket: "PLAN. GEÇİŞ", name: "BLUE HORIZON", time: "18:30", len: "160 m", type: "Konteyner", pilotReq: "Hayır", tug: "Hayır" },
            { bogaz: "CANAKKALE", yon: "GÜNEY-KUZEY", hareket: "BOĞAZDA", name: "EGE PRENSESİ", time: "15:20", len: "85 m", type: "Genel Kargo", pilotReq: "Hayır", tug: "Hayır" },

            // İstanbul - Kuzey-Güney
            { bogaz: "ISTANBUL", yon: "KUZEY-GÜNEY", hareket: "GEÇİŞE HAZIR", name: "BLACK SEA SPIRIT", time: "17:00", len: "250 m", type: "Ham Petrol Tankeri", pilotReq: "Evet", tug: "Evet" },
            { bogaz: "ISTANBUL", yon: "KUZEY-GÜNEY", hareket: "PLAN. GEÇİŞ", name: "BOSPHORUS PRIDE", time: "18:45", len: "175 m", type: "Dökme Yük", pilotReq: "Evet", tug: "Hayır" },
            { bogaz: "ISTANBUL", yon: "KUZEY-GÜNEY", hareket: "BOĞAZDA", name: "KUZEY YILDIZI", time: "15:55", len: "130 m", type: "Genel Kargo", pilotReq: "Hayır", tug: "Hayır" },

            // İstanbul - Güney-Kuzey
            { bogaz: "ISTANBUL", yon: "GÜNEY-KUZEY", hareket: "GEÇİŞE HAZIR", name: "ANATOLIA SUN", time: "16:15", len: "140 m", type: "Konteyner", pilotReq: "Evet", tug: "Hayır" },
            { bogaz: "ISTANBUL", yon: "GÜNEY-KUZEY", hareket: "PLAN. GEÇİŞ", name: "SAROS BAY", time: "19:20", len: "210 m", type: "Kimyasal Tanker", pilotReq: "Evet", tug: "Evet" },
            { bogaz: "ISTANBUL", yon: "GÜNEY-KUZEY", hareket: "BOĞAZDA", name: "MARMARA LEADER", time: "15:30", len: "165 m", type: "Dökme Yük", pilotReq: "Evet", tug: "Hayır" }
        ];

        function getAssignments() {
            try {
                return JSON.parse(localStorage.getItem("local_pilot_assignments") || "{}");
            } catch (e) {
                return {};
            }
        }

        // Tıklanan satırdan doğrudan veriyi okur (isim hatası yapmaz)
        function handleAssign(btn) {
            const shipName = btn.getAttribute("data-ship");
            const input = btn.previousElementSibling;
            const pilotName = input.value.trim();
            const assignments = getAssignments();

            if (pilotName.length > 0) {
                assignments[shipName] = pilotName;
            } else {
                delete assignments[shipName];
            }

            localStorage.setItem("local_pilot_assignments", JSON.stringify(assignments));
            applyFilter();
        }

        function applyFilter() {
            const bogaz = document.getElementById("selBogaz").value;
            const yon = document.getElementById("selYon").value;
            const hareket = document.getElementById("selHareket").value;
            const container = document.getElementById("shipContainer");
            const assignments = getAssignments();

            // Seçilen kriterlere göre gemileri filtreler
            const filteredShips = masterShipDB.filter(s => 
                s.bogaz === bogaz && s.yon === yon && s.hareket === hareket
            );

            if (filteredShips.length === 0) {
                container.innerHTML = '<div class="status-msg">Bu kriterlere uygun gemi bulunamadı.</div>';
                return;
            }

            let html = "";
            filteredShips.forEach(ship => {
                const assignedPilot = assignments[ship.name] || "";
                const isAssigned = assignedPilot.length > 0;

                html += `
                    <div class="ship-card ${isAssigned ? 'assigned' : ''}">
                        <div class="ship-header">
                            <span class="ship-name">${ship.name}</span>
                            <span class="ship-time">${ship.time}</span>
                        </div>
                        <div class="ship-details">
                            Boy: <span>${ship.len}</span> | Tip: <span>${ship.type}</span><br>
                            Kılavuz: <span>${ship.pilotReq}</span> | Römorkör: <span>${ship.tug}</span>
                        </div>
                        <div class="pilot-row">
                            <input type="text" 
                                   class="pilot-input" 
                                   placeholder="Kılavuz Kaptan Adı..." 
                                   value="${assignedPilot}">
                            <button class="btn-assign" 
                                    data-ship="${ship.name}" 
                                    onclick="handleAssign(this)">
                                ${isAssigned ? 'Güncelle' : 'Ata'}
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.onload = applyFilter;
    </script>
</body>
</html>
