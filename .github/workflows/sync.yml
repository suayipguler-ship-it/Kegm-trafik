name: KEGM Trafik Senkronizasyonu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bağımlılıkları Yükle
        run: npm install axios cheerio

      - name: Kazıyıcıyı Çalıştır
        run: node scraper.js

      - name: Değişiklikleri Kaydet ve Gönder
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Oto-Trafik Güncellemesi [skip ci]"
          file_pattern: "ships.json history.json"
