name: KEGM Trafik Senkronizasyonu

on:
  schedule:
    # Kuyruğa takılmamak için 7, 22, 37, 52 dakikalarında çalışır
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright ve Chromium Kurulumu
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Kazıyıcıyı Çalıştır
        run: node scraper.js

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Paket kurulumundan kalan tüm yan değişiklikleri tamamen çöpe at
          git checkout -- package.json package-lock.json 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          # 2. Sadece çekilen yeni verileri ekle
          git add ships.json history.json

          # 3. Veri değiştiyse güvenli şekilde gönder
          if git diff --staged --quiet; then
            echo "Verilerde değişiklik yok, push atlanıyor."
          else
            git commit -m "Oto-Trafik Güncellemesi [skip ci]"
            # Sizin webden yaptığınız güncellemeleri ezmeden birleştir:
            git pull origin main --rebase --autostash || true
            git push origin HEAD:main
          fi
