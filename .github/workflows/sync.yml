name: KEGM Trafik Senkronizasyonu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright ve Chromium Kurulumu
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Kazıyıcıyı Çalıştır
        run: node scraper.js

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          set +e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git reset HEAD package.json package-lock.json node_modules 2>/dev/null
          git checkout -- package.json package-lock.json 2>/dev/null
          git add ships.json history.json
          git commit -m "Oto-Trafik Güncellemesi [skip ci]"
          git push origin HEAD:main --force
          exit 0
