name: KEGM Trafik Senkronizasyonu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright ve Chromium Kurulumu
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Kazıyıcıyı Çalıştır
        run: node scraper.js

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Geçici paket dosyalarını temizle
          git reset HEAD package.json package-lock.json node_modules 2>/dev/null || true
          git checkout -- package.json package-lock.json 2>/dev/null || true
          
          # Sadece veri dosyalarını ekle
          git add ships.json history.json
          
          # Değişiklik varsa commit at
          if git diff --staged --quiet; then
            echo "Verilerde değişiklik yok, push atlanıyor."
          else
            git commit -m "Oto-Trafik Güncellemesi [skip ci]"
            # Sizin yaptığınız index.html değişikliklerini ezmemek için önce en son commitleri çekip birleştirir:
            git pull --rebase origin main
            git push origin main
          fi
