name: KEGM Veri Senkronizasyonu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Verileri Çek
        run: node scraper.js

      - name: Veriyi Kaydet
        run: |
          git config --global user.name "KEGM Bot"
          git config --global user.email "bot@github.com"
          git add ships.json history.json
          git commit -m "Otomatik gemi ve log listesi" || exit 0
          git push origin main || exit 0
