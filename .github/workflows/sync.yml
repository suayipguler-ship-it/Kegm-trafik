name: KEGM Veri Senkronizasyonu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Bağımlılıkları Yükle
        run: npm install axios cheerio

      - name: KEGM Verilerini Çek
        run: |
          node -e '
          const axios = require("axios");
          const cheerio = require("cheerio");
          const fs = require("fs");

          async function scrape() {
            const configs = [
              { bogaz: "CANAKKALE", yon: "GÜNEY-KUZEY", hareket: "PLAN. GEÇİŞ" },
              { bogaz: "CANAKKALE", yon: "KUZEY-GÜNEY", hareket: "PLAN. GEÇİŞ" },
              { bogaz: "ISTANBUL", yon: "GÜNEY-KUZEY", hareket: "PLAN. GEÇİŞ" },
              { bogaz: "ISTANBUL", yon: "KUZEY-GÜNEY", hareket: "PLAN. GEÇİŞ" }
            ];
            
            let allShips = [];

            for (const cfg of configs) {
              try {
                const res = await axios.get("https://www.kiyiemniyeti.gov.tr/gemi_trafigi", {
                  params: cfg,
                  headers: { "User-Agent": "Mozilla/5.0" },
                  timeout: 10000
                });
                const $ = cheerio.load(res.data);
                $("table tbody tr, table tr").each((_, row) => {
                  const cols = $(row).find("td");
                  if (cols.length >= 5) {
                    const name = $(cols[0]).text().trim();
                    if (name && !name.toLowerCase().includes("gemi") && !name.toLowerCase().includes("adı")) {
                      allShips.push({
                        bogaz: cfg.bogaz,
                        yon: cfg.yon,
                        hareket: cfg.hareket,
                        name: name,
                        time: $(cols[1]).text().trim(),
                        len: $(cols[2]).text().trim(),
                        type: $(cols[3]).text().trim(),
                        pilotReq: cols.length >= 6 ? $(cols[4]).text().trim() : "Hayır",
                        tug: cols.length >= 6 ? $(cols[5]).text().trim() : $(cols[4]).text().trim()
                      });
                    }
                  }
                });
              } catch (e) {
                console.log("Hata:", cfg, e.message);
              }
            }

            fs.writeFileSync("ships.json", JSON.stringify(allShips, null, 2));
          }

          scrape();
          '

      - name: Veriyi GitHub Deposuna Kaydet
        run: |
          git config --global user.name "KEGM Bot"
          git config --global user.email "bot@github.com"
          git add ships.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Gemi verileri güncellendi" && git push)

